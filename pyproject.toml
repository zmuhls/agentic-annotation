# Minimal project config. Packaging + console entry points are a separate,
# larger task (see reports agenda); for now this only pins the pytest layout so
# `pytest` runs from the repo root with no arguments, in CI or a fresh clone.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 is off by design: the Sonnet classification prompt in poll.py is prose
# inside an f-string, and wrapping those lines would change what the model reads.
ignore = ["E501"]
